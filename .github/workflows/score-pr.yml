name: Score submission PR
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['submissions/**']
  workflow_dispatch:
    inputs:
      pr:
        description: Submission pull request number
        required: true
        type: number
      head:
        description: Exact submission pull request head SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: submission-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
  HEOCR_SCORER_COMMIT: 39ed8dddd37d9088edb72308c6f4497d6c627e2a
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'

jobs:
  score:
    if: github.ref == 'refs/heads/main' && vars.HEOCR_ENABLE_LEADERBOARD == '1' && github.event.pull_request.draft != true
    # Score bytes from Git objects using only trusted base code and a read-only token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      comment: ${{ steps.score.outputs.comment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Score the exact PR head
        id: score
        run: |
          python review.py pr "$PR_NUMBER" "$PR_HEAD" out/score.json --comment out/comment.md
          {
            echo 'comment<<SCORE_COMMENT'
            cat out/comment.md
            echo SCORE_COMMENT
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aggregate-pr-score
          path: out/score.json
          if-no-files-found: error
          retention-days: 7

  comment:
    needs: score
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # This job handles only the aggregate comment. It never checks out any code.
      - name: Comment on the matching open PR
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ needs.score.outputs.comment }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')"
          if [[ "$current" != "$PR_HEAD" ]]; then
            echo 'PR closed, retargeted, or changed after scoring.'
            exit 0
          fi
          test -n "$COMMENT"
          printf '%s\n' "$COMMENT" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
