name: Score submission PR
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Submission pull request number
        required: true
        type: number
      head:
        description: Exact submission pull request head SHA
        required: true
        type: string
permissions:
  contents: read
env:
  HEOCR_SCORER_COMMIT: 39ed8dddd37d9088edb72308c6f4497d6c627e2a
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  score:
    if: github.ref == 'refs/heads/main' && vars.HEOCR_ENABLE_LEADERBOARD == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Score exact PR packet with main's code
        env:
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
        run: python review.py pr "$PR_NUMBER" "$PR_HEAD" out/score.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aggregate-pr-score
          path: out/score.json
          if-no-files-found: error
          retention-days: 7
